<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كاستيلو | عيد الأضحى</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
background:#12010c;
position:relative;
}

/* الخلفية */

body::before{
content:'';
position:fixed;
inset:0;

background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url('bg.jpg');

background-position:center;
background-size:cover;
background-repeat:no-repeat;

opacity:.88;

z-index:-2;
}

/* تأثير ذهبي */

body::after{
content:'';
position:fixed;
inset:0;

background:
radial-gradient(circle at top right,
rgba(255,215,120,.18),
transparent 35%);

z-index:-1;
}

/* الكارت */

.container{

width:95%;
max-width:950px;
min-height:90vh;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.15);

backdrop-filter:blur(10px);

border-radius:35px;

padding:45px 35px;

text-align:center;

box-shadow:
0 15px 50px rgba(0,0,0,.45);

}

/* اللوجو */

.logo{
width:220px;
margin-bottom:25px;
}

/* العنوان */

.title{
font-size:95px;
font-weight:900;
line-height:1;
margin-bottom:20px;
color:#d9a441;
}

.title span{
display:block;
color:#ff5a1f;
}

/* النص */

.desc{
font-size:34px;
line-height:2;
color:#fff;
margin-bottom:35px;
max-width:850px;
}

/* صورة الشخص */

.person{

width:100%;
max-width:450px;

border-radius:30px;

filter:
drop-shadow(0 10px 30px rgba(0,0,0,.5));

margin-bottom:25px;

}

/* الاسم */

.name{
font-size:70px;
font-weight:900;
color:#fff;
margin-bottom:15px;
}

/* الوظيفة */

.job{
font-size:34px;
line-height:1.8;
color:#f0d18d;
margin-bottom:30px;
}

/* الفوتر */

.footer{
font-size:28px;
color:#fff;
position:relative;
padding-top:15px;
}

.footer::before{
content:'';
position:absolute;
top:0;
right:50%;
transform:translateX(50%);
width:220px;
height:2px;
background:#d9a441;
}

/* زر رفع الصورة */

.upload-btn{

background:#d9a441;
color:#fff;

padding:14px 28px;

border-radius:14px;

cursor:pointer;

font-size:22px;
font-weight:700;

margin:20px 0;

display:inline-block;

transition:.3s;
}

.upload-btn:hover{
transform:scale(1.05);
}

/* حقل الاسم */

.name-input{

width:100%;
max-width:450px;

padding:18px 20px;

border:none;
outline:none;

border-radius:16px;

background:rgba(255,255,255,.12);

color:#fff;

font-size:24px;
text-align:center;

margin-top:15px;
}

/* زر الإرسال */

.send-btn{

margin-top:20px;

padding:16px 40px;

border:none;

border-radius:16px;

background:#ff5a1f;

color:#fff;

font-size:24px;
font-weight:800;

cursor:pointer;

transition:.3s;
}

.send-btn:hover{

transform:translateY(-3px);

background:#ff6d3a;
}

/* موبايل */

@media(max-width:768px){

.container{
padding:30px 20px;
border-radius:25px;
}

.logo{
width:150px;
}

.title{
font-size:55px;
}

.desc{
font-size:22px;
line-height:1.8;
}

.person{
max-width:280px;
}

.name{
font-size:42px;
}

.job{
font-size:24px;
}

.footer{
font-size:20px;
}

.name-input{
font-size:18px;
}

.send-btn{
font-size:20px;
padding:14px 30px;
}

}

</style>
</head>

<body>

<div class="container">

<!-- اللوجو -->
<img src="logo.png" class="logo">

<!-- العنوان -->
<h1 class="title">
<span>عيد</span>
الأضحى
</h1>

<!-- النص -->
<p class="desc">
كل عام وأنتم بخير بمناسبة عيد الأضحى المبارك
أعاده الله علينا وعليكم بالخير والبركات
</p>

<!-- صورة الشخص -->
<img src="person.png" class="person">

<!-- زر رفع صورة -->
<label for="upload" class="upload-btn">
اختيار صورة
</label>

<input type="file" id="upload" hidden>

<!-- الاسم -->
<h2 class="name">
المهندس عامر
</h2>

<input
type="text"
placeholder="اكتب الاسم هنا"
class="name-input"
id="username">

<!-- زر الإرسال -->
<button class="send-btn" onclick="changeName()">
إرسال
</button>

<!-- الوظيفة -->
<p class="job">
رئيس مجلس الإدارة<br>
لشركة كاستيلو للدهانات
</p>

<!-- الفوتر -->
