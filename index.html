<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Castello Eid</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
background:#12010c;
position:relative;
}

/* الخلفية المحسنة */

body::before{
content:'';
position:fixed;
inset:0;

background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
url('bg.jpg');

background-position:center;
background-size:cover;
background-repeat:no-repeat;

filter:
brightness(1.05)
contrast(1.1)
saturate(1.08);

transform:scale(1.05);

opacity:.32;

z-index:-2;
}

/* زخرفة خفيفة */

body::after{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at top right,
rgba(255,215,120,.12),
transparent 35%);
z-index:-1;
}

/* الكارت */

.container{
width:100%;
max-width:500px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.15);

backdrop-filter:blur(8px);

border-radius:30px;

padding:30px 25px;

text-align:center;

box-shadow:
0 10px 40px rgba(0,0,0,.35);

}

/* اللوجو */

.logo{
width:180px;
margin:auto;
margin-bottom:20px;
display:block;
}

/* العنوان */

.title{
font-size:58px;
font-weight:800;
line-height:1.1;
color:#d49a33;
margin-bottom:10px;
}

.title span{
display:block;
color:#ff5a1f;
}

/* النص */

.desc{
font-size:22px;
line-height:1.9;
color:#fff;
margin-bottom:25px;
}

/* الصورة */

.person{
width:100%;
max-width:340px;
margin:auto;
display:block;

border-radius:25px;

filter:
drop-shadow(0 10px 25px rgba(0,0,0,.45));

}

/* الاسم */

.name{
font-size:44px;
font-weight:800;
color:#fff;
margin-top:20px;
}

.job{
font-size:24px;
color:#e7c37c;
margin-top:10px;
line-height:1.7;
}

/* الفوتر */

.footer{
margin-top:25px;
font-size:20px;
color:#fff;
opacity:.9;
}

/* موبايل */

@media(max-width:768px){

.container{
padding:25px 18px;
border-radius:25px;
}

.title{
font-size:44px;
}

.desc{
font-size:18px;
}

.name{
font-size:34px;
}

.job{
font-size:19px;
}

}

</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1 class="title">
<span>عيد</span>
الأضحى
</h1>

<p class="desc">
كل عام وأنتم بخير بمناسبة عيد الأضحى المبارك
أعاده الله عليكم بالخير والبركات
</p>

<img src="person.png" class="person">

<h2 class="name">
المهندس عامر
</h2>

<p class="job">
رئيس مجلس الإدارة<br>
لشركة كاستيلو للدهانات
</p>

<div class="footer">
شركاء النجاح في دهانات كاستيلو
</div>

</div>

</body>
</html>
