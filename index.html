<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تهنئة عيد الأضحى</title>
  <style>
    body { text-align: center; font-family: 'Tahoma'; background-color: #f8f0f5; }
    .card {
      background-image: url('eid-card.jpg'); /* ضع هنا صورة التهنئة */
      background-size: cover;
      width: 600px;
      height: 800px;
      margin: auto;
      position: relative;
      color: white;
    }
    .message {
      position: absolute;
      bottom: 50px;
      width: 100%;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>عيد أضحى مبارك من دهانات كاستيللو</h2>
  <input type="text" id="nameInput" placeholder="اكتب اسمك هنا">
  <button onclick="showGreeting()">عرض التهنئة</button>

  <div class="card">
    <div class="message" id="greetingText"></div>
  </div>

  <script>
    function showGreeting() {
      const name = document.getElementById('nameInput').value;
      document.getElementById('greetingText').innerText =
        "عيد أضحى مبارك يا " + name + " 🌙✨";
    }
  </script>
</body>
</html>
