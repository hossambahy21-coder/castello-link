<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تهنئة عيد الأضحى | كاستيللو للدهانات</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Cairo', sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      background:#111;
    }

    /* الخلفية */
    .bg{
      position:absolute;
      width:100%;
      height:100%;
      background:url('background.jpg') center center/cover no-repeat;
      filter:brightness(0.45);
      z-index:1;
    }

    /* طبقة شفافة */
    .overlay{
      position:absolute;
      width:100%;
      height:100%;
      background:linear-gradient(
        to bottom,
        rgba(0,0,0,.4),
        rgba(0,0,0,.6)
      );
      z-index:2;
    }

    /* المحتوى */
    .container{
      position:relative;
      z-index:3;
      width:90%;
      max-width:700px;
      text-align:center;
      padding:40px;
      border-radius:30px;
      backdrop-filter:blur(12px);
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 10px 40px rgba(0,0,0,.4);
    }

    .logo{
      font-size:42px;
      font-weight:900;
      color:#fff;
      margin-bottom:10px;
    }

    .sub{
      color:#f5d7e0;
      margin-bottom:35px;
      font-size:18px;
    }

    h1{
      color:#fff;
      font-size:42px;
      margin-bottom:25px;
      line-height:1.5;
    }

    input{
      width:100%;
      padding:18px;
      border:none;
      outline:none;
      border-radius:15px;
      font-size:18px;
      text-align:center;
      margin-bottom:20px;
      background:rgba(255,255,255,0.12);
      color:#fff;
      border:1px solid rgba(255,255,255,0.15);
    }

    input::placeholder{
      color:#ddd;
    }

    button{
      padding:16px 45px;
      border:none;
      border-radius:15px;
      background:#d63b72;
      color:#fff;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.05);
      background:#ef4b87;
    }

    .result{
      margin-top:35px;
      color:#fff;
      font-size:28px;
      line-height:2;
      display:none;
      animation:fade 1s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .footer{
      margin-top:30px;
      color:#f0d5dd;
      font-size:15px;
    }

    @media(max-width:768px){

      .container{
        padding:25px;
      }

      h1{
        font-size:28px;
      }

      .result{
        font-size:22px;
      }

      .logo{
        font-size:32px;
      }

    }

  </style>
</head>

<body>

  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="container">

    <div class="logo">
      كاستيللو للدهانات
    </div>

    <div class="sub">
      تهنئة خاصة بمناسبة عيد الأضحى المبارك
    </div>

    <h1>
      اكتب اسمك واستلم تهنئتك الخاصة
    </h1>

    <input type="text" id="name" placeholder="اكتب اسمك هنا">

    <button onclick="showGreeting()">
      عرض التهنئة
    </button>

    <div class="result" id="result"></div>

    <div class="footer">
      © Castello Paints
    </div>

  </div>

  <script>

    function showGreeting(){

      let name = document.getElementById("name").value;

      if(name.trim() === ""){
        alert("من فضلك اكتب اسمك");
        return;
      }

      document.getElementById("result").style.display = "block";

      document.getElementById("result").innerHTML =
      `
      🌙✨<br>
      تتقدم شركة <b>كاستيللو للدهانات</b><br>
      بأرق التهاني إلى<br>
      <b>${name}</b><br>
      بمناسبة عيد الأضحى المبارك 🐑❤️<br>
      أعاده الله عليكم بالخير واليمن والبركات
      `;
    }

  </script>

</body>
</html>
