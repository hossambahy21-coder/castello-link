<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>عيد أضحى مبارك من دهانات كاستيللو</title>
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      background-color: #4b1c2f;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #7a2f4b;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      margin-top: 30px;
    }
    .card {
      background-image: url(WhatsApp Image 2026-05-26 at 6.08.10 AM); /* ضع هنا صورة التهنئة */
      background-size: cover;
      background-position: center;
      width: 600px;
      height: 800px;
      margin: auto;
      border-radius: 15px;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .overlay {
      position: absolute;
      bottom: 60px;
      width: 100%;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 2px 2px 5px #000;
    }
    input {
      padding: 10px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      margin-top: 20px;
      width: 250px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      background-color: #ffd700;
      color: #4b1c2f;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #e6c200;
    }
    footer {
      margin-top: 40px;
      font-size: 16px;
      color: #ffd700;
    }
  </style>
</head>
<body>
  <header>عيد أضحى مبارك من دهانات كاستيللو</header>

  <div class="container">
    <input type="text" id="nameInput" placeholder="اكتب اسمك هنا...">
    <button onclick="showGreeting()">عرض التهنئة</button>

    <div class="card">
      <div class="overlay" id="greetingText"></div>
    </div>
  </div>

  <footer>
    شركاء النجاح في دهانات كاستيللو<br>
    www.castellopaints.com | @castello
  </footer>

  <script>
    function showGreeting() {
      const name = document.getElementById('nameInput').value.trim();
      const greeting = name
        ? `عيد أضحى مبارك يا ${name} من دهانات كاستيللو 🌙✨`
        : 'عيد أضحى مبارك من دهانات كاستيللو 🌙✨';
      document.getElementById('greetingText').innerText = greeting;
    }
  </script>
</body>
</html>
