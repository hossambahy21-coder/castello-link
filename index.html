<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
position:relative;
overflow:hidden;
background:#12010c;
}

/* ✅ الخلفية */
body::before{
content:'';
position:fixed;
inset:0;
background:url(data:image/jpeg;base64,PUT_YOUR_BASE64_HERE) center/cover no-repeat;
z-index:-2;
}

/* طبقة تغميق خفيفة */
body::after{
content:'';
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* المحتوى لازم يكون فوق الخلفية */
.container{
position:relative;
z-index:2;
text-align:center;
color:#fff;
}

/* مثال للتهنئة */
h1{
font-size:40px;
font-weight:900;
}

p{
font-size:20px;
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">
<h1>عيد الأضحى المبارك 🐑</h1>

</div>

</body>
