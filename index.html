<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد أضحى مبارك من دهنات كاستيللو</title>
    
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <div class="hero-wrapper">
        <!-- Star decorations -->
        <div class="star star-1"></div>
        <div class="star star-2"></div>
        <div class="star star-3"></div>
        
        <main class="container">
            <div class="logo-container">
                <!-- Using the image provided from prompt context -->
                <img src="https://i.imgur.com/5wF8X9l.png" alt="Castello Logo" class="main-logo">
            </div>
            
            <div class="content-card">
                <h1>عشان العيد، نهنئك!</h1>
                <p class="subtitle">أدخل اسمك عشان تشوف رسالة التهنية الخاصة بيك.</p>
                
                <form id="nameForm" class="form-container">
                    <div class="input-group">
                        <input type="text" id="customerName" placeholder="اكتب اسمك الجدي..." required autocomplete="off">
                        <i class="fa-solid fa-user input-icon"></i>
                    </div>
                    <button type="submit" class="btn-primary">
                        ابدأ التهنية
                        <i class="fa-solid fa-circle-right"></i>
                    </button>
                </form>
            </div>
        </main>
        
        <footer>
            <p>© 2024 دهنات كاستيللو - شركاء النجاح</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
