<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>كاستيللو للدهانات | عيد الأضحى</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Cairo', sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      position:relative;
      background:#000;
    }

    /* الخلفية بالصورة */

    body::before{
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      background-image:url('/mnt/data/Bash.jpeg');
      background-size:cover;
      background-position:center;
      filter:brightness(.35);
      z-index:1;
    }

    /* طبقة شفافة */

    body::after{
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      background:rgba(0,0,0,.45);
      z-index:2;
    }

    .container{
      position:relative;
      z-index:3;
      width:90%;
      max-width:750px;
      padding:45px;
      border-radius:30px;
      text-align:center;

      background:rgba(0,0,0,.35);
      backdrop-filter:blur(12px);

      border:1px solid rgba(255,255,255,.1);

      box-shadow:0 15px 40px rgba(0,0,0,.5);
    }

    .logo{
      color:#fff;
      font-size:42px;
      font-weight:900;
      margin-bottom:10px;
    }

    .subtitle{
      color:#ffd5e3;
      margin-bottom:35px;
      font-size:18px;
    }

    h1{
      color:#fff;
      font-size:42px;
      line-height:1.6;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:18px;
      border:none;
      outline:none;
      border-radius:15px;
      margin-bottom:20px;

      background:rgba(255,255,255,.1);

      color:#fff;
      font-size:18px;
      text-align:center;

      border:1px solid rgba(255,255,255,.15);
    }

    input::placeholder{
      color:#ddd;
    }

    button{
      border:none;
      padding:16px 45px;
      border-radius:15px;

      background:#d52c69;
      color:#fff;

      font-size:19px;
      font-weight:700;

      cursor:pointer;
      transition:.3s;
    }

    button:hover{
      transform:scale(1.05);
      background:#ef3f7f;
    }

    .result{
      display:none;
      margin-top:35px;

      color:#fff;
      font-size:30px;
      line-height:2;

      animation:fade 1s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .footer{
      margin-top:30px;
      color:#f1d9df;
      font-size:15px;
    }

    @media(max-width:768px){

      .container{
        padding:25px;
      }

      h1{
        font-size:28px;
      }

      .result{
        font-size:22px;
      }

      .logo{
        font-size:32px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      كاستيللو للدهانات
    </div>

    <div class="subtitle">
      تهنئة خاصة بمناسبة عيد الأضحى المبارك
    </div>

    <h1>
      اكتب اسمك واستلم تهنئتك الخاصة ✨
    </h1>

    <input type="text" id="name" placeholder="اكتب اسمك هنا">

    <button onclick="showGreeting()">
      عرض التهنئة
    </button>

    <div class="result" id="result"></div>

    <div class="footer">
      © Castello Paints
    </div>

  </div>

  <script>

    function showGreeting(){

      let name = document.getElementById("name").value;

      if(name.trim() == ""){

        alert("من فضلك اكتب اسمك");

        return;
      }

      document.getElementById("result").style.display = "block";

      document.getElementById("result").innerHTML = `
      
      🌙✨<br>

      تتقدم شركة <b>كاستيللو للدهانات</b><br>

      بأطيب التهاني إلى<br>

      <span style="color:#ff4d88;font-size:40px;font-weight:900">
      ${name}
      </span>

      <br>

      بمناسبة عيد الأضحى المبارك 🐑❤️<br>

      أعاده الله عليكم بالخير واليُمن والبركات

      `;
    }

  </script>

</body>
</html>
