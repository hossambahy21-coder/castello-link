<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاستيللو للدهانات - تهنئة بعيد الأضحى</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>كاستيللو للدهانات</h1>
            <p class="tagline">أفضل أنواع الدهانات والطلاءات</p>
        </div>

        <div class="card" id="greetingCard">
            <div class="content">
                <h2>🎉 بعيد الأضحى المبارك 🎉</h2>
                <p class="subtitle">نهنئكم بحلول عيد الأضحى المبارك</p>
                
                <form id="nameForm">
                    <input type="text" id="clientName" placeholder="أدخل اسمك هنا" required>
                    <button type="submit">🎊 تهانينا لك</button>
                </form>
            </div>
        </div>

        <div class="card hidden" id="resultCard">
            <div class="content">
                <div class="eid-mubarak">🐏عيد الأضحى المبارك🐏</div>
                <h2 class="personal-greeting">
                    كل عام وأنتم بخير يا <span id="showName"></span> 🎊
                </h2>
                <p class="message">
                    من عائلة كاستيللو للدهانات<br>
                    نتمنى لكم أعياداً مليئة بالفرح والسرور
                </p>
                <button onclick="resetForm()" class="reset-btn">🎁 تهاني جديدة</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
